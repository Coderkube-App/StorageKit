name: Automated Versioning

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: semantic_version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: ""
          major_pattern: "BREAKING CHANGE"
          minor_pattern: "^feat"
          bump_each_commit: false
          search_commit_body: true

      - name: Create and push tag
        if: steps.semantic_version.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.semantic_version.outputs.version }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: steps.semantic_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semantic_version.outputs.version }}
          name: Release ${{ steps.semantic_version.outputs.version }}
          generate_release_notes: true
